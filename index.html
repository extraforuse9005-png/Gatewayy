<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>FamGateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto+Mono&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="login" class="login" hidden>
    <div class="login-card">
      <div class="brand big-brand">Fam<span>Gateway</span><sup>™</sup></div>
      <p class="muted">Sign in with Google to manage payments and your API key.</p>
      <div id="gbtn"></div>
      <p id="loginNote" class="err"></p>
    </div>
  </section>

  <section id="app" hidden>
    <header class="topbar">
      <div class="brand">Fam<span>Gateway</span><sup>™</sup></div>
      <button id="menuBtn" class="menu-btn" aria-label="Open menu">☰</button>
    </header>

    <aside id="drawer" class="drawer">
      <div class="drawer-head">
        <div class="brand">Fam<span>Gateway</span><sup>™</sup></div>
        <button id="closeBtn" class="menu-btn" aria-label="Close menu">✕</button>
      </div>
      <p class="group">MAIN</p>
      <nav>
        <a href="#dashboard" data-tab="dashboard">Dashboard</a>
        <a href="#test" data-tab="test">Test payment</a>
      </nav>
      <p class="group">SETTINGS</p>
      <nav>
        <a href="#integration" data-tab="integration">Integration</a>
        <a href="#api" data-tab="api">API docs</a>
      </nav>
      <div class="drawer-foot">
        <div class="me">
          <span id="avatar" class="avatar">?</span>
          <div style="min-width:0">
            <strong id="who"></strong>
            <span id="email" class="muted"></span>
          </div>
        </div>
        <button id="logoutBtn" class="btn ghost wide" type="button">Sign out</button>
      </div>
    </aside>
    <div id="overlay" class="overlay" hidden></div>

    <main id="view" class="view"></main>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
