<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto+Condensed:wght@700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="pay-body">
  <main class="pay-wrap">
    <section class="pay-card" id="card">
      <div class="pay-top">
        <div class="pay-name" id="merchant">Payment</div>
        <div class="pay-tags">
          <span><i class="dot g"></i>Fast</span>
          <span><i class="dot r"></i>Safe</span>
        </div>
      </div>

      <div class="qr-box" id="qrBox"><div id="qr"></div></div>

      <button id="saveBtn" class="save-btn" type="button">⤓&nbsp;&nbsp;Save in Gallery</button>

      <p id="wait" class="wait"><span class="spin"></span><span>Waiting for payment ...</span></p>
      <p id="timer" class="timer">◷&nbsp;&nbsp;<b id="left">--:--</b></p>
      <p id="expired" class="expired" hidden></p>

      <div id="success" class="success" hidden>
        <div class="s-title">Payment Success</div>
        <div class="s-check">✓</div>
        <div class="s-sub" id="redirect">Redirecting..</div>
      </div>
    </section>
  </main>

<script>
const id = new URLSearchParams(location.search).get('id');
const $ = (s) => document.querySelector(s);
let info = null, qrMade = false, poller, ticker, finished = false;

const mmss = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};

function stop() {
  finished = true;
  clearInterval(poller);
  clearInterval(ticker);
}

function fail(msg) {
  stop();
  $('#qrBox').hidden = true;
  $('#saveBtn').hidden = true;
  $('#wait').hidden = true;
  $('#timer').hidden = true;
  $('#expired').textContent = msg;
  $('#expired').hidden = false;
}

function succeed() {
  stop();
  $('#qrBox').hidden = true;
  $('#saveBtn').hidden = true;
  $('#wait').hidden = true;
  $('#timer').hidden = true;
  $('#success').hidden = false;
  if (info.return_url) {
    const u = new URL(info.return_url);
    u.searchParams.set('payment_id', id);
    u.searchParams.set('status', 'success');
    u.searchParams.set('amount', info.amount.toFixed(2));
    u.searchParams.set('requested_amount', info.requested_amount.toFixed(2));
    setTimeout(() => { location.href = u.toString(); }, 2500);
  } else {
    $('#redirect').textContent = 'Payment received. You can close this page.';
  }
}

function makeQr() {
  const upi = 'upi://pay?pa=' + encodeURIComponent(info.upiId) +
    '&pn=' + encodeURIComponent(info.merchantName || 'Merchant') +
    '&am=' + info.amount.toFixed(2) + '&cu=INR' +
    '&tn=' + encodeURIComponent('FP' + id.slice(0, 6));
  new QRCode($('#qr'), { text: upi, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  qrMade = true;
}

async function poll() {
  if (finished) return;
  if (!id) return fail('Payment link is missing its id.');
  const r = await fetch('/api/orders/' + encodeURIComponent(id));
  if (!r.ok) return fail('This payment link was not found.');
  info = await r.json();
  $('#merchant').textContent = info.merchantName || 'Payment';
  if (info.status === 'success') return succeed();
  if (info.status === 'failed') return fail('Time is up. This payment link has expired.');
  if (!qrMade) makeQr();
}

function tick() {
  if (info && !finished) $('#left').textContent = mmss(info.expiresAt - Date.now());
}

$('#saveBtn').onclick = () => {
  const canvas = document.querySelector('#qr canvas');
  const img = document.querySelector('#qr img');
  const url = canvas ? canvas.toDataURL('image/png') : (img && img.src);
  if (!url) return;
  const a = document.createElement('a');
  a.href = url;
  a.download = 'payment-qr.png';
  a.click();
};

poll().catch(() => fail('Could not reach the server. Refresh to try again.'));
poller = setInterval(() => poll().catch(() => {}), 3000);
ticker = setInterval(tick, 1000);
</script>
</body>
</html>
